name: Deploy to Cloud Panel via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newPortfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./newPortfolio

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          timeout: 120s
          command_timeout: 10m
          debug: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/pematashi/htdocs/pematashi.com

            # Fetch and pull latest code from main branch
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Install dependencies
            npm ci

            # Build the app
            npm run build
