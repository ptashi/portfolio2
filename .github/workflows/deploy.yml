name: Deploy to Cloud Panel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          timeout: 120s
          command_timeout: 10m
          debug: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/pematashi/htdocs/pematashi.com/portfolio2

            # Fetch and pull latest code from main branch
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Install dependencies
            npm --prefix newPortfolio ci

            # Build the app
            npm --prefix newPortfolio run build

            # Start or restart the server with PM2
            cd newPortfolio
            export PORT=3276
            pm2 restart portfolio --update-env || pm2 start "npx serve -s dist" --name portfolio
